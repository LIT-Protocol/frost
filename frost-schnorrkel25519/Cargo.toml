[package]
name = "frost-schnorrkel25519"
edition.workspace = true

version.workspace = true
authors.workspace = true
readme = "README.md"
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords = ["cryptography", "crypto", "ristretto", "threshold", "signature"]
description = "A Schnorr signature scheme over the prime-order Ristretto group that supports FROST."

[package.metadata.docs.rs]
features = ["serde"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
byte-strings = "0.3"
document-features.workspace = true
frost-core = { path = "../frost-core", version = "2.2.0", default-features = false }
frost-rerandomized = { path = "../frost-rerandomized", version = "2.2.0", default-features = false }
lit-rust-crypto = { workspace = true, features = ["curve25519-dalek"] }
merlin = "3"
rand_core.workspace = true
schnorrkel = "0.11"

[dev-dependencies]
criterion.workspace = true
frost-core = { path = "../frost-core", version = "2.2.0", features = ["test-impl"] }
frost-rerandomized = { path = "../frost-rerandomized", version = "2.2.0", features = ["test-impl"] }
insta.workspace = true
hex.workspace = true
lazy_static.workspace = true
proptest.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde_json.workspace = true

[features]
nightly = []
default = ["serialization", "cheater-detection", "std"]
#! ## Features
## Enable standard library support.
std = ["frost-core/std"]
## Enable `serde` support for types that need to be communicated. You
## can use `serde` to serialize structs with any encoder that supports
## `serde` (e.g. JSON with `serde_json`).
serde = ["frost-core/serde", "lit-rust-crypto/serde"]
## Enable a default serialization format. Enables `serde`.
serialization = ["serde", "frost-core/serialization", "frost-rerandomized/serialization"]
## Enable cheater detection
cheater-detection = ["frost-core/cheater-detection", "frost-rerandomized/cheater-detection"]

[lib]
# Disables non-criterion benchmark which is not used; prevents errors
# when using criterion-specific flags
bench = false

[[bench]]
name = "bench"
harness = false
